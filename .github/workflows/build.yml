name: Build C++ to WebAssembly and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.70'

      - name: Compile to WebAssembly
        run: |
          emcc -v
          mkdir -p public
          emcc main.cpp -s USE_SDL=2 -s ALLOW_MEMORY_GROWTH=1 --shell-file shell.html -o public/index.html

      - name: Verify browser build
        run: |
          test -s public/index.html
          test -s public/index.wasm\n          cp manifest.webmanifest sw.js icon.svg public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
