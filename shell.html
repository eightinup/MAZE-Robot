<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17152b">\n  <meta name="mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n  <link rel="manifest" href="./manifest.webmanifest">\n  <link rel="icon" href="./icon.svg" type="image/svg+xml">\n  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="description" content="MAZE Robot — коллекция пиксельных приключений: лабиринт, танковая арена и шахта.">
  <title>MAZE Robot — Pixel Arcade</title>
  <style>
    :root { color-scheme: dark; background: #17152b; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #17152b; color: #fff4d6; font-family: ui-monospace, "Cascadia Mono", "Courier New", monospace; }
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow: hidden; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 16px 16px; }
    .cabinet { width: min(100%, 560px, 72dvh); aspect-ratio: 4 / 5; display: grid; place-items: center; padding: 8px; background: #292541; border: 4px solid #62577f; box-shadow: 0 0 0 4px #100f1e, 0 14px 0 #100f1e, 0 22px 45px #0009; }
    #canvas { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; touch-action: none; outline: none; background: #f8e8c0; }
    .hint { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); left: 12px; right: 12px; text-align: center; color: #aaa2c7; font-size: 11px; line-height: 1.4; pointer-events: none; }
    @media (min-width: 700px) and (min-height: 760px) { .cabinet { width: min(560px, 72dvh); } }
  </style>
</head>
<body>
  <main class="cabinet" aria-label="Игровой экран MAZE Robot">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0" aria-label="Игровое поле. Используйте клавиатуру или экранные кнопки."></canvas>
  </main>
  <p class="hint">КЛАВИАТУРА: WASD / СТРЕЛКИ · СЕНСОРНЫЙ ЭКРАН: ИГРОВЫЕ КНОПКИ</p>
  <script>
    // Явно привязываем SDL2/Emscripten к видимому canvas.
    var Module = {
      canvas: document.getElementById("canvas"),
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); }
    };
  </script>
  <script>\n    if ("serviceWorker" in navigator) {\n      window.addEventListener("load", function() { navigator.serviceWorker.register("./sw.js").catch(function(error) { console.warn("Offline mode unavailable:", error); }); });\n    }\n  </script>\n  {{{ SCRIPT }}}
</body>
</html>
